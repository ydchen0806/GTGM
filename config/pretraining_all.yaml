# ═══════════════════════════════════════════════════════════════════════
# GTGM+ Pretraining Configuration — All Modalities (CT + MRI + EM)
# ═══════════════════════════════════════════════════════════════════════
#
# This configuration enables joint pretraining on CT, MRI, and EM data.
# Modify DATA.type to switch between modality-specific or full pretraining.
#
# Usage:
#   torchrun --nnodes=1 --nproc_per_node=8 pretrain/main.py \
#       --config config/pretraining_all.yaml
#
# Reference:
#   GTGM+: Knowledge-Enhanced 3D Vision-Language Pretraining for
#   Multi-Modal Medical Image Analysis (CVIU 2026)
# ═══════════════════════════════════════════════════════════════════════

NAME: 'pretraining_all'

# ─── Model Architecture ────────────────────────────────────────────────
MODEL:
    model_type: 'superhuman'  # Options: 'mala', 'superhuman', 'UNETR', 'ResUNet'
    input_nc: 1               # Input channels
    output_nc: 1              # Output channels
    return_dict: False         # If True, dataset returns dict with captions
    match_name: True           # If True, match volume name to pre-generated captions

    # SwinUNETR settings
    unetr_size: [32, 160, 160]
    patch_size: [4, 16, 16]
    kernel_size: [1, 3, 3]
    if_sigmoid: True

    # Mala-specific settings
    init_mode_mala: 'kaiming'

    # Superhuman UNet settings
    filters:
        - 28
        - 36
        - 48
        - 64
        - 80
    upsample_mode: 'transposeS'  # Options: 'bilinear', 'nearest', 'transpose', 'transposeS'
    decode_ratio: 1
    merge_mode: 'cat'            # Options: 'add', 'cat'
    pad_mode: 'zero'             # Options: 'zero', 'replicate'
    bn_mode: 'async'             # Options: 'sync', 'async'
    relu_mode: 'elu'             # Options: 'elu', 'relu', 'leaky'
    init_mode: 'kaiming_normal'  # Options: 'kaiming_normal/uniform', 'xavier_normal/uniform'

# ─── Training Settings ─────────────────────────────────────────────────
TRAIN:
    resume: False
    if_valid: True

    # ⚠️  UPDATE THESE PATHS to your local environment
    cache_path: './results/caches'
    save_path: './results/models'
    record_path: './results/logs'
    caption_path: './data/offline_caption'  # Directory containing pre-generated captions

    pad: 0
    loss_func: 'MSE'             # Options: 'MSE', 'L1'
    random_choice: False
    multi_scale_mse: False
    free_layers: 9               # Number of frozen text encoder layers

    # Optimizer settings
    opt_type: 'adam'
    total_iters: 500000
    warmup_iters: 0
    base_lr: 0.0001
    end_lr: 0.00001
    display_freq: 100
    valid_freq: 500
    save_freq: 1000
    decay_iters: 200000
    weight_decay: 1.0e-9
    power: 1.5

    # Dataloader settings
    batch_size: 16
    num_workers: 4
    if_cuda: True
    random_seed: 555             # Set to -1 for random

# ─── Data Settings ──────────────────────────────────────────────────────
DATA:
    dataset_name: 'cremi-C'
    unlabel_dataset: 'cremi-C-200'

    # Data type: 'CT', 'MRI', 'EM', or 'all' (joint pretraining)
    type: 'all'

    # ⚠️  UPDATE THESE PATHS to your local dataset locations
    # EM data paths
    folder_name: './data/em_pretrain_data'
    unlabel_datalist:
        - 'AC4_5.h5'
        - 'AC4_6.h5'
        - 'AC4_7.h5'
        - 'AC4_9.h5'
        - 'AC4_10.h5'
        - 'AC4_11.h5'
        - 'AC4_12.h5'
        - 'AC4_13.h5'

    # CT data paths (MSD tasks)
    # ct_data_dirs:
    #   - '/path/to/MSD/Task03_Liver'
    #   - '/path/to/MSD/Task06_Lung'
    #   - '/path/to/MSD/Task05_Prostate'
    #   - '/path/to/MSD/Task08_HepaticVessel'
    #   - '/path/to/MSD/Task10_Colon'

    # MRI data paths (MSD tasks)
    # mri_data_dirs:
    #   - '/path/to/MSD/Task01_BrainTumour'
    #   - '/path/to/MSD/Task02_Heart'
    #   - '/path/to/MSD/Task04_Hippocampus'
    #   - '/path/to/MSD/Task07_Pancreas'

    test_split: 25
    unlabel_split: 100
    unlabel_split_rate: 1
    data_folder: './data'
    if_norm_images: False

    # Data augmentation (labeled)
    if_scale_aug_labeled: False
    scale_factor: 1.5
    if_filp_aug_labeled: False
    if_rotation_aug_labeled: False
    if_intensity_aug_labeled: False
    if_elastic_aug_labeled: False
    if_noise_aug_labeled: False
    min_noise_std: 0.01
    max_noise_std: 0.2
    if_mask_aug_labeled: False
    if_blur_aug_labeled: True
    min_kernel_size: 3
    max_kernel_size: 9
    min_sigma: 0
    max_sigma: 2

    # Data augmentation (unlabeled / pretraining)
    per_mode: 1
    if_scale_aug_unlabel: False
    if_filp_aug_unlabel: True
    if_rotation_aug_unlabel: True
    if_intensity_aug_unlabel: True
    if_noise_aug_unlabel: True
    if_blur_aug_unlabel: True
    if_mask_aug_unlabel: False
    if_sobel_aug_unlabel: False
    if_mixup_aug_unlabel: False
    if_misalign_aug_unlabel: False
    if_elastic_aug_unlabel: False
    if_artifact_aug_unlabel: False
    if_missing_aug_unlabel: False
    if_blurenhanced_aug_unlabel: False

# ─── Test Settings ──────────────────────────────────────────────────────
TEST:
    pad: 0
    model_name: ''

# ─── Network Settings (for VLP) ────────────────────────────────────────
network:
    img_model: resnet50
    text_model: bert               # Text encoder type
    free_layers: 6                 # Frozen layers in text encoder
    text_model_arch: general       # Options: 'specialized', 'general'
    feature_dim: 768               # Text encoder output dimension

    projection_head:
        mlp_hidden_size: 2048
        projection_size: 768

# ─── Device Settings (controlled by torchrun) ──────────────────────────
device_id: 0
device_num: 1

# ─── VLP Trainer Settings ──────────────────────────────────────────────
trainer:
    batch_size: 2                  # Per-GPU batch size for pretraining
    test_batch_size: 200
    checkpoint_interval: 100000
    max_epochs: 200
    max_iterations: 200000         # Total pretraining iterations
    lr: 2.0e-5                     # Learning rate
    num_workers: 8
    test_interval: 2
    loss: 'only_clip'              # Loss type: 'only_clip' (CLIP + BarlowTwins)
    smooth: 'exp'
    ratio: 0.2

# ─── Optimizer Settings ────────────────────────────────────────────────
optimizer:
    params:
        lr: 2.0e-5
        weight_decay: 5.0e-2

# ─── Experiment Name ───────────────────────────────────────────────────
wandb_name: 'gtgm_plus_pretrain'
